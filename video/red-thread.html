<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Red Thread</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: contain; }
  body.render canvas { height: auto; }
</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script src="engine.js"></script>
<script>
'use strict';
/* =====================================================================
   THE RED THREAD: a red thread on A's little finger. A pulls, runs, gets
   tangled, gives up and lets go. Then B comes along the thread.
   The thread is a rope simulation (Verlet chain); B holds the other end
   the whole time, off screen at first. The engine lives in engine.js.
   ===================================================================== */

// ---------------------------------------------------------------- story
const T = {
  fadeIn: 0.5,
  look0: 0.55, look1: 1.15, turn0: 1.15,
  tug1: 1.4, tug2: 1.7,
  pull0: 2.2, pull1: 3.5,
  run: 3.5, tangle: 6.1, fall0: 6.25, knee: 6.6, camStop: 6.2,
  free0: 7.0, sit0: 7.1, sitHit: 7.5,
  text1a: 8.0, text1b: 11.0,
  open0: 9.0, open1: 9.8, still0: 9.4,
  move0: 10.4, move1: 11.6,
  bWalk: 11.35, bStop: 13.4,
  headUp0: 13.4, headUp1: 14.0, stand0: 13.6, stand1: 14.4,
  meet0: 14.4, meet1: 15.2,
  text2a: 15.0, text2b: 18.0,
  fadeOut: 18.2, end: 19.0,
  stills: [1.0, 2.8, 5.0, 6.8, 9.4, 11.0, 13.8, 15.5],
};

// ---------------------------------------------------------------- the street
const POSTS = [-155, 190, 535, 880, 1225, 1570, 1915, 2260];      // street lamps along the front of the sidewalk
const POST_D = 8, POST_H = 318, POST_R = 4;
const LEDGE = { x0: -900, x1: 3200, d0: 76, d1: 100, z1: 30 };  // the low concrete ledge at the back of the sidewalk
const A0 = [250, 40], X_END = 1290;                            // where A stands, where its run ends
const B0 = [1765, 36], B_STOP = [1438, 40];
const RED = [226, 34, 48], LAMPC = [204, 210, 224];
const SKY = (() => {     // the skyline: far buildings with a few dim windows (deterministic)
  const r = mulberry32(91), out = [];
  for (let x = -2600, i = 0; x < 5200; i++) {
    const w = 260 + r() * 420, h = 900 + r() * 1700, d = 1500 + r() * 1100;
    const wins = [];
    for (let wz = 120; wz < h - 80; wz += 70) for (let wx = 50; wx < w - 50; wx += 62) if (r() < 0.33) wins.push([wx, wz, 0.35 + r() * 0.65]);
    out.push({ x, w, h, d, wins, shade: 0.75 + r() * 0.3 });
    x += w * (0.55 + r() * 0.5);
  }
  return out.sort((a, b) => b.d - a.d);
})();

// ---------------------------------------------------------------- the figures
const A = new Fig('A', { x: A0[0], d: A0[1], yaw: -25, seed: 2.1 });
const B = new Fig('B', { x: B0[0], d: B0[1], yaw: 180, seed: 4.6 });
const KNOT = J => add(J.hand.R, add(mul(J.Ft, 3), [0, 0, -3]));     // the thread is tied round A's little finger
const midPole = (side, fn, down = 60, out = 18) => (t, J) => add(lerp3(J.sh[side], fn(t, J), 0.5), add(mul(J.Rt, (side === 'R' ? 1 : -1) * out), [0, 0, -down]));

// hand over hand: strokes get shorter (faster); the hands take turns
const STROKES = (() => { const out = []; let t = T.pull0; for (let j = 0; t < T.pull1 - 0.05; j++) { const d = lerp(0.24, 0.13, Math.min(1, j / 5)); out.push({ t0: t, t1: t + d, side: j % 2 ? 'L' : 'R' }); t += d; } return out; })();
function strokeHand(side, t, J) {
  const sg = side === 'R' ? 1 : -1, sh = J.sh[side];
  const FW = add(sh, add(add(mul(J.Ft, 60), mul(J.Rt, sg * 2)), [0, 0, -22]));
  const BK = add(sh, add(add(mul(J.Ft, 16), mul(J.Rt, sg * 12)), [0, 0, -82]));
  let p = FW, pulled = false;
  for (const s of STROKES) {
    if (t < s.t0) break;
    const u = clamp((t - s.t0) / (s.t1 - s.t0));
    if (s.side === side) { p = lerp3(FW, BK, E.io(u)); pulled = true; }              // pulls back
    else if (pulled) p = add(lerp3(BK, FW, E.io(u)), [0, 0, 10 * Math.sin(PI * u)]);  // reaches forward again
  }
  return p;
}

(function a() {
  const F = A, tr = A.tr;
  tr.breath.v0 = 1.1;
  // notices the thread, lifts its hand and looks at it
  const look = (t, J) => add(add(J.N, add(mul(J.F, 30), mul(J.R, 5))), [0, 0, 4]);
  const gLook = F.goal('R', look, midPole('R', look, 50, 26));
  gLook.to(T.look0, T.look1, 1, E.io).to(T.turn0, T.turn0 + 0.3, 0, E.io);
  tr.head.to(T.look0 + 0.1, T.look1, 16, E.io).to(T.turn0, T.turn0 + 0.3, 2, E.io);
  tr.headRoll.to(T.look0 + 0.1, T.look1, -8, E.io).to(T.turn0, T.turn0 + 0.3, 0, E.io);
  F.turn(T.turn0, T.turn0 + 0.25, 0, { steps: 2, lift: 4 });
  // two hard tugs with the tied hand
  const tug = (t, J) => {
    const fw = add(J.sh.R, add(mul(J.Ft, 44), [0, 0, -34])), back = add(J.sh.R, add(add(mul(J.Ft, 14), mul(J.Rt, 14)), [0, 0, -12]));
    const yank = a => { const u = (t - a) / 0.3; return u <= 0 || u >= 1 ? 0 : u < 0.25 ? E.out2(u / 0.25) : 1 - E.io((u - 0.25) / 0.75); };
    return lerp3(fw, back, yank(T.tug1) + yank(T.tug2));
  };
  const gTug = F.goal('R', tug, midPole('R', tug, 40, 24));
  gTug.to(T.turn0 + 0.05, T.tug1 - 0.02, 1, E.io);
  tr.lean.to(T.tug1, T.tug1 + 0.08, -7, E.out2).to(T.tug1 + 0.1, T.tug1 + 0.3, 2, E.io).to(T.tug2, T.tug2 + 0.08, -8, E.out2).to(T.tug2 + 0.1, T.tug2 + 0.3, 4, E.io);
  // hand over hand, faster and faster
  const gR = F.goal('R', (t, J) => strokeHand('R', t, J), midPole('R', (t, J) => strokeHand('R', t, J), 40, 26));
  const gL = F.goal('L', (t, J) => strokeHand('L', t, J), midPole('L', (t, J) => strokeHand('L', t, J), 40, 26));
  gR.to(T.pull0 - 0.25, T.pull0, 1, E.io).to(T.pull1 - 0.04, T.pull1 + 0.36, 0, E.io);
  gL.to(T.pull0 - 0.3, T.pull0, 1, E.io).to(T.pull1 - 0.04, T.pull1 + 0.36, 0, E.io);
  gTug.to(T.pull0 - 0.25, T.pull0, 0, E.io);
  tr.lean.to(T.pull0 - 0.2, T.pull0 + 0.2, 10, E.io); tr.pz.to(T.pull0 - 0.2, T.pull0 + 0.2, -10, E.io);
  tr.head.to(T.pull0 - 0.2, T.pull0 + 0.2, 8, E.io);
  tr.pz.to(T.run - 0.1, T.run + 0.2, 0, E.io); tr.head.to(T.run, T.run + 0.3, -2, E.io);
  // runs after the thread
  F.walk(T.run, [X_END, A0[1]], MOOD.run, 'R');
  // caught by its own thread: stumbles and drops to its knees (shins flat behind, sitting back a little, hunched)
  const ZP = 66, KNX = X_END + 52, D = A0[1], PKX = KNX - Math.sqrt(DIM.thigh ** 2 - (ZP - 10) ** 2);
  for (const side of ['R', 'L']) {
    const sg = side === 'R' ? -1 : 1;
    F.footGoal(side, () => ({ ank: [KNX - 76, D + sg * 9, 7], pitch: 0, yaw: 180, kyaw: 0, kdir: [1, 0, -0.35], lift: side === 'R' ? 10 : 16 }))
      .to(T.fall0 + (side === 'R' ? 0.05 : 0), T.knee - (side === 'R' ? 0.02 : 0), 1, E.in2);
  }
  tr.ox.to(T.fall0, T.knee, PKX - X_END, E.io);
  tr.pz.to(T.fall0 + 0.05, T.knee, ZP - H0, E.in2);
  tr.lean.to(T.tangle, T.fall0 + 0.2, 30, E.io).to(T.knee - 0.05, T.knee + 0.4, 26, E.out2);
  tr.head.to(T.fall0, T.knee, 20, E.io); tr.slump.to(T.knee, T.knee + 0.4, 14, E.io);
  tr.breath.to(T.knee, T.knee + 0.3, 2.6);
  const thigh = side => (t, J) => add(lerp3(J.hip[side], J.knee[side], 0.8), [0, 0, 9]);
  F.goal('R', thigh('R'), midPole('R', thigh('R'), 20, 40)).to(T.fall0 + 0.1, T.knee + 0.05, 1, E.io);
  F.goal('L', thigh('L'), midPole('L', thigh('L'), 20, 40)).to(T.fall0 + 0.12, T.knee + 0.07, 1, E.io);
  // frees its legs: tugs the loops off its shins
  const shin = side => (t, J) => add(lerp3(J.knee[side], J.ank[side], 0.25 + 0.1 * Math.sin((t - T.free0) * 14)), [0, side === 'R' ? -9 : 9, 12 + 8 * Math.sin((t - T.free0) * 14)]);
  const fR = F.goal('R', shin('R'), midPole('R', shin('R'), 10, 40)), fL = F.goal('L', shin('L'), midPole('L', shin('L'), 10, 40));
  fR.to(T.free0 - 0.1, T.free0 + 0.08, 1, E.io); fL.to(T.free0 - 0.07, T.free0 + 0.11, 1, E.io);
  tr.lean.to(T.free0 - 0.1, T.free0 + 0.1, 22, E.io); tr.head.to(T.free0 - 0.1, T.free0 + 0.1, 30, E.io); tr.slump.to(T.free0 - 0.1, T.free0 + 0.1, 20, E.io);
  // sits back on the ledge, forearms on the knees, head down
  const SY = -40, SF = fwd(SY), SR = rgt(SY), SEAT = [X_END + 6, 88, LEDGE.z1 + 8];
  tr.yaw.to(T.sit0, T.sitHit + 0.1, SY, E.io);
  tr.ox.to(T.sit0, T.sitHit, SEAT[0] - X_END, E.io); tr.od.to(T.sit0, T.sitHit, SEAT[1] - A0[1], E.io);
  tr.pz.to(T.sit0, T.sit0 + 0.12, ZP - H0 + 10, E.io).to(T.sit0 + 0.12, T.sitHit, SEAT[2] - H0, E.in2);
  const feetAt = sg => [SEAT[0] + SF[0] * 64 + SR[0] * sg * 10, SEAT[1] + SF[1] * 64 + SR[1] * sg * 10, 7];
  for (const side of ['R', 'L']) F.footGoal(side, () => ({ ank: feetAt(side === 'R' ? 1 : -1), pitch: 0, yaw: SY, kdir: [SF[0] * 0.5, SF[1] * 0.5, 1], lift: 26 }))
    .to(T.sit0 + 0.05, T.sitHit + 0.05, 1, E.io);
  tr.lean.to(T.sit0, T.sit0 + 0.18, 2, E.io).to(T.sitHit, T.sitHit + 0.5, 22, E.io); tr.slump.to(T.sit0, T.sit0 + 0.18, 6, E.io); tr.head.to(T.sit0, T.sit0 + 0.2, 14, E.io);
  tr.slump.to(T.sitHit, T.sitHit + 0.6, 17, E.io); tr.head.to(T.sitHit - 0.1, T.sitHit + 0.6, 24, E.io);
  tr.breath.to(T.sitHit, T.sitHit + 0.5, 2.4).to(8.6, 9.6, 1.3);
  const fore = side => (t, J) => add(J.knee[side], add(mul(J.F, 24), add(mul(J.R, (side === 'R' ? 1 : -1) * 4), [0, 0, -6 + (side === 'R' ? 5 * E.io(inv(T.open0, T.open0 + 0.4, t)) * (1 - E.io(inv(T.open1, T.open1 + 0.5, t))) : 0)])));
  F.goal('R', fore('R'), (t, J) => add(J.knee.R, [0, -6, -20])).to(T.sit0 + 0.2, T.sitHit + 0.15, 1, E.io);
  F.goal('L', fore('L'), (t, J) => add(J.knee.L, [0, 6, -20])).to(T.sit0 + 0.22, T.sitHit + 0.17, 1, E.io);
  // looks up at B, stands up slowly, turns to B, the hands meet
  tr.head.to(T.headUp0, T.headUp1, 0, E.io); tr.slump.to(T.headUp0, T.headUp1 + 0.3, 4, E.io);
  const fc = add(lerp3(feetAt(1), feetAt(-1), 0.5), mul([SF[0], SF[1], 0], -6));
  tr.ox.to(T.stand0, T.stand1, fc[0] - X_END, E.io); tr.od.to(T.stand0, T.stand1, fc[1] - A0[1], E.io);
  tr.pz.to(T.stand0, T.stand1, -2, E.io);
  tr.lean.to(T.stand0, T.stand0 + 0.3, 30, E.io).to(T.stand0 + 0.3, T.stand1, 3, E.io);
  tr.yaw.to(T.stand0 + 0.2, T.meet0 + 0.3, -16, E.io);
  tr.breath.to(T.stand0, T.stand1, 1.0);
  const meet = (t, J) => meetPoint(t);
  F.goal('R', meet, midPole('R', meet, 50, 20)).to(T.meet0, T.meet1, 1, E.io);
})();

(function b() {
  const F = B, tr = B.tr;
  tr.breath.v0 = 1.0;
  F.walk(T.bWalk, B_STOP, MOOD.walk, 'L');
  // winds the thread round its left hand as it walks
  const hold = (t, J) => add(J.sh.L, add(add(mul(J.Ft, 30), mul(J.Rt, 4)), [0, 0, -52]));
  const wind = (t, J) => { const h = hold(t, J), a = TAU * 1.5 * t; return add(h, add(mul(J.Rt, 12 * Math.cos(a)), add(mul(J.Ft, 3), [0, 0, 11 * Math.sin(a)]))); };
  F.goal('L', hold, midPole('L', hold, 50, 20)).to(T.bWalk - 0.3, T.bWalk + 0.2, 1, E.io);
  const gW = F.goal('R', wind, midPole('R', wind, 50, 20));
  gW.to(T.bWalk - 0.2, T.bWalk + 0.3, 1, E.io).to(T.bStop + 0.2, T.bStop + 0.6, 0, E.io);
  tr.head.v0 = 8;
  tr.head.to(T.bStop - 0.3, T.bStop + 0.3, 4, E.io);
  // holds out its hand
  const meet = (t, J) => meetPoint(t);
  F.goal('L', meet, midPole('L', meet, 50, 20)).to(T.meet0 - 0.1, T.meet1 - 0.1, 1, E.io);
})();
// where the two hands meet: between them, a little in front
function meetPoint(t) {
  const a = A.pose(t, true), b = B.pose(t, true);
  return add(lerp3(a.sh.R, b.sh.L, 0.5), [0, -6, -42]);
}

// ---------------------------------------------------------------- the thread (rope simulation)
// N particles 6 apart. Particle 0 is tied to A's finger. The other end comes from B: first it lies on the street out of
// frame, from 10.4 s B lifts it and holds it in its hand. B lets thread out whenever it is pulled tight and takes thread in
// (reels) at the rates below. Gravity, air drag, floor friction, the lamp posts and the ledge are collisions; hands can
// grip it (hand over hand, holding the slack). After the soft constraints a follow-the-leader pass keeps the thread from
// stretching. The wraps round the posts are loops the thread is pulled into (soft guides) that the thread can slide
// through; the tangle round A's legs is a loop on its shins. Fixed 1/240 s steps, so frame t always gives the same shape.
const ROPE = (() => {
  const N = 900, SP = 6, DT = 1 / 240, G = 1500, R_TH = 1.4, ITER = 14;
  const T0 = -1.2;                                     // settle the starting shape before the film begins
  // B takes thread in: reel speed (units/s) while there is slack; slack it aims for (thread length / straight distance)
  const reelV = t => t < T.move0 ? 0 : t < T.move1 ? 300 + 1500 * Math.sin(PI * inv(T.move0, T.move1, t)) : t < T.bStop ? 900 : t < T.meet1 + 0.3 ? 400 : 60;
  const reelAim = t => t < T.meet0 ? 1.08 : 1.02;
  const FLOOR_S = add(B.pose(0).hand.L, [40, 0, 0]); FLOOR_S[2] = R_TH;
  const source = (t, bJ) => lerp3(FLOOR_S, add(bJ.hand.L, [0, 0, -2]), E.io(inv(T.move0, T.move1 - 0.3, t)));
  const bodyOf = J => ({ x: J.P[0], y: J.P[1], caps: [[J.P, J.N, 11], [J.hip.R, J.knee.R, 7], [J.hip.L, J.knee.L, 7], [J.knee.R, J.ank.R, 6], [J.knee.L, J.ank.L, 6]] });
  const hands = t => { const a = A.pose(t), b = B.pose(t); return { knot: KNOT(a), aR: a.hand.R, aL: a.hand.L, S: source(t, b), aJ: a, body: bodyOf(a) }; };
  // the posts the thread catches on while A runs past
  const WRAPS = [535, 880].map(x => ({ x, t: null }));
  for (const w of WRAPS) for (let t = T.run; t < T.knee; t += 0.005) if (A.worldRoot(t)[0] > w.x + 36) { w.t = t; break; }
  const WN = 34, WL = WN * SP;                          // particles / length of thread in one wrap
  const helix = (x, u) => { const a = u * 4.8 * PI + 0.6; return [x + Math.cos(a) * (POST_R + 5), POST_D + Math.sin(a) * (POST_R + 5), 86 - 76 * u]; };
  let st = null;
  function init() {
    const h = hands(T0), p = new Float64Array(N * 3);
    const drop = [h.knot[0] + 40, h.knot[1], R_TH], d1 = len(sub(drop, h.knot)), d2 = len(sub(h.S, drop));
    const free = Math.ceil((d1 * 1.05 + d2 * 1.03) / SP);
    for (let i = 0; i < N; i++) {
      const s = i * SP;
      let q = s < d1 * 1.05 ? lerp3(h.knot, drop, s / (d1 * 1.05)) : lerp3(drop, h.S, Math.min(1, (s - d1 * 1.05) / (d2 * 1.03)));
      if (s >= d1 * 1.05) q[1] += 9 * Math.sin((s - d1 * 1.05) / 70) * Math.min(1, (s - d1 * 1.05) / 60);
      if (i > free) q = add(h.S, [(i - free) * SP, 0, 0]);
      q[2] = Math.max(R_TH, q[2]);
      p.set(q, i * 3);
    }
    return { n: 0, p, q: Float64Array.from(p), kf: free, grips: {}, last: 0, wraps: [], legs: [], bunch: null, reeled: 0, pin: new Uint8Array(N), held: new Uint8Array(N) };
  }
  const D3 = (p, i, x) => Math.hypot(p[i * 3] - x[0], p[i * 3 + 1] - x[1], p[i * 3 + 2] - x[2]);
  // pull particle i toward point x until it is at most SP away (follow the leader); keep a little of the motion as speed
  function ftl(p, q, i, x) {
    const a = i * 3, ex = p[a] - x[0], ey = p[a + 1] - x[1], ez = p[a + 2] - x[2], d = Math.hypot(ex, ey, ez);
    if (d <= SP) return;
    const f = (SP - d) / d, mx = ex * f, my = ey * f, mz = ez * f;
    p[a] += mx; p[a + 1] += my; p[a + 2] += mz; q[a] += mx; q[a + 1] += my; q[a + 2] += mz;
  }
  // a designed pull (guides, grips, the held bunch); held particles lose most of their speed each step
  function pull(p, q, i, x, w) {
    const a = i * 3; st.held[i] = 1;
    for (let c = 0; c < 3; c++) p[a + c] += (x[c] - p[a + c]) * w;
  }
  function step(t) {
    const { p, q, pin } = st;
    const h = hands(t), S = h.S;
    let K = Math.floor(st.kf);
    const pt = i => [p[i * 3], p[i * 3 + 1], p[i * 3 + 2]];
    // B reels while there is slack
    let freeLen = 0; for (let i = 1; i < K; i++) freeLen += Math.hypot(p[i * 3] - p[i * 3 - 3], p[i * 3 + 1] - p[i * 3 - 2], p[i * 3 + 2] - p[i * 3 - 1]);
    const reeling = reelV(t) > 0 && freeLen > reelAim(t) * len(sub(S, h.knot)) && st.kf > 12;
    if (reeling) { const dk = reelV(t) * DT / SP; st.kf -= dk; st.reeled += dk * SP; }
    K = Math.floor(st.kf);
    // integrate
    for (let i = 0; i < N; i++) {
      const a = i * 3;
      if (i >= K) { const o = (i - st.kf) * SP; p[a] = S[0] + o; p[a + 1] = S[1]; p[a + 2] = S[2]; q[a] = p[a]; q[a + 1] = p[a + 1]; q[a + 2] = p[a + 2]; continue; }
      const fr = p[a + 2] < R_TH + 0.6 ? 0.2 : 0.012;
      for (let c = 0; c < 3; c++) {
        const v = (p[a + c] - q[a + c]) * (1 - (c < 2 ? fr : 0.012));
        q[a + c] = p[a + c]; p[a + c] += v + (c === 2 ? -G * DT * DT : 0);
      }
    }
    // grips: each pulling stroke grabs the thread ahead of the hand
    const grips = [];
    for (const s of STROKES) if (t >= s.t0 && t < s.t1) {
      if (!(s.t0 in st.grips)) {
        // the hand closes on the thread about one arm's reach further along and draws it in
        const best = Math.min(K - 3, st.last + 16);
        st.grips[s.t0] = best; st.last = best;
      }
      if (st.grips[s.t0] > 0) grips.push([st.grips[s.t0], add(s.side === 'R' ? h.aR : h.aL, [0, 0, -2]), sstep(s.t0 - 0.04, s.t0 + 0.35 * (s.t1 - s.t0), t)]);
    }
    // wraps: when A has run past a post, the thread between A and the post is pulled round it
    if (t < T.tangle) for (const w of WRAPS) if (w.t !== null && t >= w.t && !st.wraps.some(g => g.x === w.x)) {
      // the stretch of thread about as far along it as the post is from the hand gets caught
      const lim = st.wraps.length ? Math.min(...st.wraps.map(g => g.s)) - WL : (K - 30) * SP;
      st.wraps.push({ x: w.x, s: Math.min(lim, len(sub(helix(w.x, 0), h.knot)) * 1.06), t0: t });
    }

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  draw(Math.min(t, T.end - 1e-4));
  grain(t, 0.06);
  const fade = Math.max(1 - sstep(0, T.fadeIn, t), sstep(T.fadeOut, T.end, t));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
function getCues() {
  const steps = [];
  for (const f of [A, B]) for (const c of f.cues) if (f === A || c.t > T.bWalk - 0.1) steps.push({ ...c, who: f.id });
  steps.forEach(c => { c.frame = Math.round(c.t * FPS); });
  return { story: { ...T, strokes: STROKES.map(s => +s.t0.toFixed(3)) }, steps: steps.sort((a, b) => a.t - b.t), ticks: [], fps: FPS, duration: T.end };
}
window.FPS = FPS;
window.DURATION = TEST ? WALKTEST.dur : T.end;
window.render = render;
window.getCues = getCues;
window.STORY = T;
window.__debug = { A, B, ROPE, cam, P, meetPoint };

const qs = new URLSearchParams(location.search);
if (qs.has('render')) document.body.classList.add('render');
else {
  const t0 = performance.now();
  const startAt = parseFloat(qs.get('t') || '0');
  const loop = () => { render((startAt + (performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(loop);
}
</script>
