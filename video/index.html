<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Twice</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: contain; }
  body.render canvas { height: auto; }
</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script src="engine.js"></script>
<script>
'use strict';
/* =====================================================================
   ASK TWICE: a deterministic 2D stick-figure short (scenes + story).
   The engine lives in engine.js.
   ===================================================================== */
// ---------------------------------------------------------------- story
// Every scene beat lives here. The sound timeline reads these too.
const T = {
  // 1. party
  clink: 0.97,
  aTurn0: 1.2, aTurn1: 1.85,
  aWalk: 1.88,                     // A takes a few light steps over to the main figure
  ask0: 2.5, ask1: 3.85,
  nod: 4.05,
  fine0: 4.15, fine1: 5.25,
  aEnd: 0,
  laugh0: 4.55, laugh1: 5.95,
  cut1: 6.2,                       // hard cut + door slam
  // 2. home
  lock: 6.5,
  deflate0: 6.3, deflate1: 7.0,
  hWalk: 6.62,                      // the rest is filled in once the walks are planned
  sit0: 0, sitHit: 0, sit1: 0,
  maskOff0: 0, maskGrab: 0, maskDown: 0,
  slump0: 0, slump1: 0,
  // 3. morning
  morn: 0, alarm0: 0, alarm1: 0,
  rise0: 0, stand0: 0, stand1: 0, look0: 0, pick: 0, wear: 0, straight0: 0,
  mTurn0: 0, mTurn1: 0, mWalk: 0,
  doorOpen: 0,
  ask2a: 0, ask2b: 0,
  fade0: 0, end: 0,
};

/* =====================================================================
   SCENE 1: PARTY
   ===================================================================== */
const PARTY = (() => {
  const WALL = 300;
  const M = new Fig('M1', { x: 296, d: 10, yaw: -64, seed: 1.3, cup: 'R' });
  const A = new Fig('A', { x: 502, d: 30, yaw: 34, seed: 2.1, cup: 'R' });
  const B = new Fig('B', { x: 104, d: 196, yaw: 6, seed: 3.7, cup: 'R' });
  const C = new Fig('C', { x: 204, d: 206, yaw: -174, seed: 4.4, cup: 'L' });
  const D = new Fig('D', { x: 596, d: 158, yaw: -150, seed: 5.9, cup: 'L' });
  const figs = [M, A, B, C, D];

  // everyone holds a cup at the waist
  for (const f of figs) {
    const s = f.cup;
    if (!s) continue;
    f.tr['aSw' + s] = new Track(26); f.tr['aEl' + s] = new Track(78); f.tr['aOut' + s] = new Track(14);
  }
  // dancing / swaying to the muffled music
  M.tr.dance = new Track(0.32); A.tr.dance = new Track(0.55); B.tr.dance = new Track(0.75);
  C.tr.dance = new Track(0.7); D.tr.dance = new Track(0.62);
  M.tr.lean = new Track(1); M.tr.head = new Track(-3);

  // M holds the mask up in front of its face with the left hand
  const maskGripL = J => add(add(maskOnFace(J).pos, mul(J.R, -12)), [0, -3, -30]);
  M.goal('L', (t, J) => maskGripL(J), (t, J) => add(add(J.sh.L, mul(J.R, -45)), add([0, 0, -60], mul(J.F, 30)))).to(-1, -0.9, 1);

  // B and C clink cups
  const clinkP = [154, 200, 214];
  B.goal('R', () => add(clinkP, [-9, 0, 0])).to(0.5, T.clink, 1, E.overK(2.5)).to(T.clink + 0.15, T.clink + 0.6, 0, E.io);
  C.goal('L', () => add(clinkP, [9, 2, 0])).to(0.55, T.clink, 1, E.overK(2.5)).to(T.clink + 0.18, T.clink + 0.65, 0, E.io);
  B.tr.lean.to(0.5, 0.95, 7).to(1.15, 1.6, 3); C.tr.lean.to(0.55, 0.95, 7).to(1.15, 1.6, 3);
  B.tr.head.to(1.1, 1.4, -14, E.io).to(1.4, 1.9, 0);   // drink
  C.tr.head.to(1.15, 1.45, -12, E.io).to(1.45, 1.95, 0);

  // D chats with A, gesturing with the free hand
  D.goal('R', (t, J) => add(add(J.N, mul(J.F, 42)), add(mul(J.R, 14), [0, 0, -30 + 6 * Math.sin(t * 7)]))).to(0.25, 0.55, 0.8).to(1.0, 1.35, 0);
  D.tr.yaw.to(1.6, 2.3, -160);
  A.tr.head.to(0.2, 0.6, 4).to(0.9, 1.2, -4);

  // A turns from D to M and takes a few light steps toward it
  A.turn(T.aTurn0, T.aTurn1, -170, { first: 'R', lift: 9 });
  A.tr.dance.to(T.aTurn0, T.aTurn0 + 0.4, 0.15);
  const aEnd = A.walk(T.aWalk, [436, 22], MOOD.bouncy, 'L');
  // "how are you?": open-hand gesture once it has arrived
  A.goal('L', (t, J) => add(add(J.N, mul(J.F, 44)), add(mul(J.R, -10), [0, 0, -34 + 3 * Math.sin((t - aEnd) * 9)]))).to(aEnd + 0.1, aEnd + 0.5, 0.85, E.over).to(T.ask1 - 0.3, T.ask1 + 0.2, 0);
  A.tr.head.to(aEnd + 0.1, aEnd + 0.4, 6).to(aEnd + 0.6, aEnd + 0.9, -2);
  A.tr.lean.to(aEnd + 0.1, aEnd + 0.5, 6, E.over).to(T.ask1, T.ask1 + 0.4, 2);
  T.aEnd = aEnd;

  // M turns its torso toward A, then the exaggerated happy nod
  M.tr.yaw.to(2.2, 2.9, -40, E.over);
  M.tr.dance.to(2.3, 2.8, 0.12);
  const n = T.nod;
  M.tr.head.to(n, n + 0.16, 30, E.out2).to(n + 0.16, n + 0.36, -14, E.io).to(n + 0.36, n + 0.54, 20, E.io).to(n + 0.54, n + 0.78, -6, E.io).to(n + 0.78, n + 1.1, -2, E.io);
  M.tr.pz.to(n - 0.02, n + 0.14, -10, E.out2).to(n + 0.14, n + 0.32, 2, E.io).to(n + 0.32, n + 0.5, -6, E.io).to(n + 0.5, n + 0.8, 0, E.over);
  M.tr.lean.to(n, n + 0.16, 9, E.out2).to(n + 0.16, n + 0.4, -3, E.io).to(n + 0.4, n + 0.9, 1, E.over);
  M.tr.bounce.to(n + 0.6, n + 0.8, 0.6).to(T.laugh1 - 0.3, T.laugh1, 0);

  // everybody laughs: shoulders shaking
  const lg = (f, d0, amp) => f.tr.laugh.to(T.laugh0 + d0, T.laugh0 + d0 + 0.2, amp, E.out2).to(T.laugh1 - 0.5 + d0 * 0.5, T.laugh1 + d0 * 0.4, 0, E.io);
  lg(A, 0, 1); lg(B, 0.06, 1); lg(C, 0.12, 0.9); lg(D, 0.03, 0.85); lg(M, 0.2, 0.35);
  B.goal('L', (t, J) => add(add(J.P, mul(J.F, 26)), [0, 0, 42])).to(T.laugh0 + 0.1, T.laugh0 + 0.4, 0.9).to(T.laugh1 - 0.4, T.laugh1, 0);
  D.tr.dance.to(T.laugh0, T.laugh0 + 0.3, 0.3);

  const lamp = [372, 80, 488];
  function objects(c, t, poses) {
    const items = figs.map((f, i) => ({ d: poses[i].P[1], draw: () => drawFigure(c, f, poses[i], i === 0 ? { mask: maskOf(poses[0]), handOver: ['L'] } : {}) }));
    items.sort((a, b) => b.d - a.d);
    for (const it of items) it.draw();
  }
  const maskOf = maskOnFace;
  function draw(t) {
    cam.x = 372;
    cam.zoom = lerp(1.42, 1.5, E.sine(inv(0, T.cut1, t))); cam.hy = 650; cam.h = 270;
    // wall + floor
    const floorY = P([0, WALL, 0])[1];
    let g = ctx.createLinearGradient(0, 0, 0, floorY);
    g.addColorStop(0, '#060606'); g.addColorStop(1, '#141312');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, floorY);
    g = ctx.createLinearGradient(0, floorY, 0, H);
    g.addColorStop(0, '#191816'); g.addColorStop(1, '#0b0b0b');
    ctx.fillStyle = g; ctx.fillRect(0, floorY, W, H - floorY);
    // warm wall wash behind the lamp
    const lp = P(lamp);
    g = ctx.createRadialGradient(lp[0], floorY - 40, 10, lp[0], floorY - 40, 520);
    g.addColorStop(0, 'rgba(255,196,96,0.20)'); g.addColorStop(1, 'rgba(255,196,96,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, floorY);
    // skirting line
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, floorY - 2, W, 4);
    // warm pool of light on the floor
    const fp = P([lamp[0], 70, 0]);
    ctx.save(); ctx.translate(fp[0], fp[1]); ctx.scale(1, 0.2);
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, 420);
    g.addColorStop(0, 'rgba(255,190,90,0.32)'); g.addColorStop(0.5, 'rgba(255,170,70,0.10)'); g.addColorStop(1, 'rgba(255,170,70,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 420, 0, TAU); ctx.fill(); ctx.restore();

    const poses = figs.map(f => f.pose(t));
    reflection(c => objects(c, t, poses), floorY, 0.3);
    for (const J of poses) contactShadow(ctx, J, 0.6);
    objects(ctx, t, poses);

    // light cone
    const sb = P([lamp[0], lamp[1], lamp[2] - 20]);
    softLayer(18, 'screen', c => {
      const g = c.createLinearGradient(0, sb[1], 0, fp[1] + 40);
      g.addColorStop(0, 'rgba(255,200,110,0.16)'); g.addColorStop(1, 'rgba(255,200,110,0)');
      c.fillStyle = g;
      c.beginPath(); c.moveTo(sb[0] - 34, sb[1]); c.lineTo(sb[0] + 34, sb[1]); c.lineTo(sb[0] + 300, fp[1] + 40); c.lineTo(sb[0] - 300, fp[1] + 40); c.closePath(); c.fill();
    });
    // warm light falloff over everything
    ctx.save(); ctx.globalCompositeOperation = 'multiply';
    g = ctx.createRadialGradient(lp[0], lp[1] + 330, 40, lp[0], lp[1] + 330, 640);
    g.addColorStop(0, '#fff6e6'); g.addColorStop(0.55, '#c9bca6'); g.addColorStop(1, '#35312c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();

    // pendant lamp
    const sway = 0.012 * Math.sin(t * 1.1);
    const top = [0, -999];
    ctx.save();
    ctx.translate(lp[0], 0); ctx.rotate(sway); ctx.translate(-lp[0], 0);
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(lp[0], top[0]); ctx.lineTo(lp[0], lp[1] - 46); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lp[0] - 12, lp[1] - 48); ctx.lineTo(lp[0] + 12, lp[1] - 48); ctx.lineTo(lp[0] + 50, lp[1]); ctx.lineTo(lp[0] - 50, lp[1]); ctx.closePath();
    ctx.fillStyle = '#121110'; ctx.fill(); ctx.strokeStyle = '#2b2925'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(lp[0], lp[1], 50, 7, 0, 0, TAU); ctx.fillStyle = '#ffd27a'; ctx.fill();
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    g = ctx.createRadialGradient(lp[0], lp[1] + 6, 2, lp[0], lp[1] + 6, 170);
    g.addColorStop(0, 'rgba(255,214,130,0.75)'); g.addColorStop(0.2, 'rgba(255,190,90,0.25)'); g.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = g; ctx.fillRect(lp[0] - 200, lp[1] - 180, 400, 380); ctx.restore();

    vignette(0.78);
    captionAt(t, 'HOW ARE YOU?', T.ask0, T.ask1);
    captionAt(t, 'FINE.', T.fine0, T.fine1);
  }
  return { draw, figs };
})();

/* =====================================================================
   SCENES 2 + 3: HOME AT NIGHT, THEN MORNING (same room)
   ===================================================================== */
const HOME = (() => {
  const WALL = 230;
  const bed = { x0: 120, x1: 488, d0: 56, d1: WALL, z0: 0, z1: 58 };
  const mattress = { x0: 124, x1: 484, d0: 58, d1: WALL - 2, z0: 58, z1: 98 };
  const table = { x0: 306, x1: 358, d0: -26, d1: 22, z0: 0, z1: 100 };
  const door = { x0: 500, x1: 650, z1: 395 };
  const win = { x0: 196, x1: 364, z0: 168, z1: 352 };
  const clock = [452, WALL, 330];
  const start = [548, 160], stand = [404, 24];
  const M = new Fig('M2', { x: start[0], d: start[1], yaw: -136, seed: 1.3, t0: T.cut1 });
  const tr = M.tr;
  // just in from the party, still "on"
  tr.lean.v0 = 1; tr.head.v0 = -3; tr.slump.v0 = 0;
  // deflate: the posture drops the moment the door is shut
  tr.slump.to(T.deflate0, T.deflate1, 17, E.io2); tr.lean.to(T.deflate0, T.deflate1, 8, E.io2);
  tr.head.to(T.deflate0 + 0.1, T.deflate1 + 0.2, 26, E.io2); tr.shDrop.to(T.deflate0, T.deflate1, 7, E.io2);
  tr.pz.to(T.deflate0, T.deflate1, -3, E.io2);
  tr.aOutL.to(T.deflate0, T.deflate1, 4); tr.aOutR.to(T.deflate0, T.deflate1, 4);
  tr.aElL.to(T.deflate0, T.deflate1, 8); tr.aElR.to(T.deflate0, T.deflate1, 8);
  tr.aSwL.to(T.deflate0, T.deflate1, 1); tr.aSwR.to(T.deflate0, T.deflate1, 1);
  tr.breath.to(T.deflate0, T.deflate0 + 0.5, 1.8).to(T.deflate1 + 1, T.deflate1 + 2, 1.2);

  // heavy, slow walk to the bed; it arrives facing the little table
  const walkEnd = M.walk(T.hWalk, stand, MOOD.heavy, 'L');
  // sit back onto the edge of the bed
  T.sit0 = walkEnd + 0.08; T.sit1 = T.sit0 + 0.95; T.sitHit = T.sit0 + 0.74;
  tr.pf.to(T.sit0 + 0.05, T.sit1, -64, E.io);
  tr.pz.to(T.sit0 + 0.1, T.sit1, 104 - H0, E.overK(3));
  tr.lean.to(T.sit0, T.sit0 + 0.5, 28, E.io).to(T.sit0 + 0.5, T.sit1 + 0.25, 14, E.over);
  tr.head.to(T.sit0, T.sit1, 22);
  tr.aSwL.to(T.sit0, T.sit1, 22); tr.aSwR.to(T.sit0, T.sit1, 22);
  tr.aElL.to(T.sit0, T.sit1, 46); tr.aElR.to(T.sit0, T.sit1, 46);
  tr.aOutL.to(T.sit0, T.sit1, 12); tr.aOutR.to(T.sit0, T.sit1, 12);

  // take the mask off slowly and lay it on the table, face up
  const maskWorn = J => maskOnFace(J).pos;
  const gripL = J => add(maskWorn(J), add(mul(J.R, -18), [0, -4, -20]));
  const tableSpot = [330, -4, table.z1 + 4];
  const tableGrip = add(tableSpot, [12, -6, 6]);
  T.maskOff0 = T.sit1 + 0.08; T.maskGrab = T.maskOff0 + 0.38; T.maskDown = T.maskGrab + 0.9;
  const carryOff = (t, J) => {
    const p = E.io(inv(T.maskGrab, T.maskDown, t));
    const a = lerp3(gripL(J), tableGrip, p); a[2] += 22 * Math.sin(PI * p) * (1 - p * 0.5);
    return a;
  };
  const poleL = (t, J) => add(add(J.sh.L, mul(J.R, -50)), [0, -10, -50]);
  M.goal('L', (t, J) => t < T.maskGrab ? gripL(J) : carryOff(t, J), poleL)
    .to(T.maskOff0, T.maskGrab, 1, E.io).to(T.maskDown + 0.1, T.maskDown + 0.55, 0, E.io);
  tr.lean.to(T.maskGrab + 0.15, T.maskDown, 34, E.io);
  tr.head.to(T.maskOff0, T.maskGrab, 10).to(T.maskGrab, T.maskDown, 34);

  // slump: elbows on knees, head in hands
  T.slump0 = T.maskDown + 0.2; T.slump1 = T.slump0 + 0.9;
  tr.lean.to(T.slump0, T.slump1, 46, E.io2); tr.slump.to(T.slump0, T.slump1, 22, E.io2); tr.head.to(T.slump0, T.slump1, 44, E.io2);
  tr.shDrop.to(T.slump0, T.slump1, 9, E.io2);
  const faceHand = (side) => (t, J) => add(add(J.Hc, mul(norm(add(J.Ft, [0, 0, -0.75])), DIM.headR * 0.9)), mul(J.Rt, (side === 'R' ? 1 : -1) * 12));
  const kneePole = side => (t, J) => add(J.knee[side], add(mul(J.Ft, 10), [0, 0, -14]));
  const handsUpL = M.goal('L', faceHand('L'), kneePole('L')).to(T.slump0 + 0.08, T.slump1, 1, E.io2);
  const handsUpR = M.goal('R', faceHand('R'), kneePole('R')).to(T.slump0 + 0.14, T.slump1 + 0.05, 1, E.io2);
  tr.breath.to(T.slump1, T.slump1 + 0.5, 1.7);

  // ---------------- morning
  T.morn = T.slump1 + 0.6;
  T.alarm0 = T.morn + 0.12; T.alarm1 = T.alarm0 + 1.45;
  T.rise0 = T.morn + 0.3;
  tr.head.to(T.rise0, T.rise0 + 0.6, 20, E.io2); tr.lean.to(T.rise0, T.rise0 + 0.6, 30, E.io2);
  tr.slump.to(T.rise0, T.rise0 + 0.6, 15);
  // hands slide from the face down to the knees
  const kneeHand = side => (t, J) => add(J.knee[side], [0, -2, 9]);
  // elbows out and back while the hands rest on the knees
  const outPole = side => (t, J) => add(J.sh[side], add(add(mul(J.Rt, (side === 'R' ? 1 : -1) * 60), mul(J.Ft, -25)), [0, 0, -30]));
  handsUpL.to(T.rise0 + 0.05, T.rise0 + 0.55, 0, E.io); handsUpR.to(T.rise0 + 0.05, T.rise0 + 0.55, 0, E.io);
  const kneesL = M.goal('L', kneeHand('L'), outPole('L')).to(T.rise0 + 0.05, T.rise0 + 0.55, 1, E.io);
  const kneesR = M.goal('R', kneeHand('R'), outPole('R')).to(T.rise0 + 0.05, T.rise0 + 0.55, 1, E.io);
  // stand up slowly, pushing on the knees
  T.stand0 = T.rise0 + 0.6; T.stand1 = T.stand0 + 0.88;
  tr.lean.to(T.stand0, T.stand0 + 0.42, 40, E.io2).to(T.stand0 + 0.42, T.stand1, 14, E.io2);
  tr.pf.to(T.stand0 + 0.12, T.stand1, 0, E.io2);
  tr.pz.to(T.stand0 + 0.22, T.stand1, -4, E.io2);
  tr.head.to(T.stand0, T.stand1, 26);
  kneesL.to(T.stand0 + 0.42, T.stand0 + 0.8, 0, E.io); kneesR.to(T.stand0 + 0.46, T.stand0 + 0.85, 0, E.io);
  tr.aSwL.to(T.stand0 + 0.45, T.stand1, 2); tr.aSwR.to(T.stand0 + 0.45, T.stand1, 2);
  tr.aElL.to(T.stand0 + 0.45, T.stand1, 10); tr.aElR.to(T.stand0 + 0.45, T.stand1, 10);
  tr.aOutL.to(T.stand0 + 0.45, T.stand1, 5); tr.aOutR.to(T.stand0 + 0.45, T.stand1, 5);
  // a moment looking down at the mask
  T.look0 = T.stand1 - 0.1;
  tr.head.to(T.look0, T.look0 + 0.4, 40, E.io);
  // pick it up and put it on
  T.pick = T.look0 + 0.66; T.wear = T.pick + 0.38;
  tr.lean.to(T.pick - 0.32, T.pick, 30, E.io).to(T.pick, T.wear, 6, E.io);
  tr.pz.to(T.pick - 0.32, T.pick, -18, E.io).to(T.pick, T.wear, -2, E.io);
  const carryOn = (t, J) => { const p = E.io(inv(T.pick, T.wear, t)); const a = lerp3(tableGrip, gripL(J), p); a[2] += 16 * Math.sin(PI * p); return a; };
  M.goal('L', (t, J) => t < T.pick ? tableGrip : carryOn(t, J), poleL).to(T.pick - 0.36, T.pick, 1, E.io).to(T.wear, T.wear + 0.5, 0, E.io);
  tr.head.to(T.pick, T.wear, 4, E.io);
  // straighten up into the fake, upright posture (with overshoot)
  T.straight0 = T.wear + 0.02;
  const so = E.overK(9);
  tr.slump.to(T.straight0, T.straight0 + 0.38, -5, so); tr.lean.to(T.straight0, T.straight0 + 0.38, -2, so);
  tr.head.to(T.straight0, T.straight0 + 0.38, -6, so); tr.shDrop.to(T.straight0, T.straight0 + 0.38, -3, so);
  tr.pz.to(T.straight0, T.straight0 + 0.38, 0, so);
  tr.breath.to(T.straight0, T.straight0 + 0.4, 0.8);
  // turn around to the door and leave with a forced light step
  T.mTurn0 = T.straight0 + 0.22; T.mTurn1 = T.mTurn0 + 0.58;
  M.turn(T.mTurn0, T.mTurn1, 43, { lift: 7, mood: 'forced', steps: 4 });
  T.mWalk = T.mTurn1 + 0.02;
  const exitEnd = M.walk(T.mWalk, [570, 206], MOOD.forced, 'R');
  T.doorOpen = T.mWalk + 0.35;
  T.ask2a = T.doorOpen + 0.3; T.end = Math.max(exitEnd + 0.25, T.ask2a + 1.4); T.ask2b = T.end - 0.25; T.fade0 = T.end - 0.75;
  // a hand reaches for the door
  M.goal('R', (t, J) => add(add(J.N, mul(J.F, 42)), add(mul(J.R, 12), [0, 0, -40]))).to(T.doorOpen - 0.3, T.doorOpen, 0.6).to(T.doorOpen + 0.2, T.doorOpen + 0.5, 0);

  function maskState(t, J) {
    const worn = () => maskOnFace(J);
    const onTable = { pos: tableSpot, wf: 1, hf: 0.42, rot: 0.08, face: 0, depth: tableSpot[1] - 6 };
    const inHand = p => { // p: 0 = on face, 1 = lying on the table
      const w = worn();
      const pos = add(J.hand.L, lerp3(sub(w.pos, gripL(J)), sub(tableSpot, tableGrip), p));
      return { pos, wf: lerp(w.wf, 1, p), hf: lerp(1, 0.42, E.io(p)), rot: lerp(w.rot, 0.08, p) + 0.25 * Math.sin(PI * p), face: lerp(w.face, 0, p), depth: Math.min(J.hand.L[1] - 8, lerp(w.depth, onTable.depth, p)) };
    };
    if (t < T.maskGrab) return worn();
    if (t < T.maskDown) return inHand(E.io(inv(T.maskGrab, T.maskDown, t)));
    if (t < T.pick) return onTable;
    if (t < T.wear) return inHand(1 - E.io(inv(T.pick, T.wear, t)));
    return worn();
  }

  // light: 0 = night, 1 = morning
  const dayAt = t => sstep(T.morn, T.morn + 1.1, t);
  const doorAng = t => 80 * E.over(inv(T.doorOpen, T.doorOpen + 0.75, t), 3);

  function drawRoomBack(c, t, day) {
    const floorY = P([0, WALL, 0])[1];
    const wallTop = mixc([16, 18, 22], [92, 94, 96], day), wallBot = mixc([22, 25, 30], [118, 119, 120], day);
    let g = c.createLinearGradient(0, 0, 0, floorY);
    g.addColorStop(0, rgb(wallTop)); g.addColorStop(1, rgb(wallBot));
    c.fillStyle = g; c.fillRect(0, 0, W, floorY);
    g = c.createLinearGradient(0, floorY, 0, H);
    g.addColorStop(0, rgb(mixc([24, 26, 30], [124, 124, 124], day))); g.addColorStop(1, rgb(mixc([10, 11, 13], [58, 58, 58], day)));
    c.fillStyle = g; c.fillRect(0, floorY, W, H - floorY);
    // floorboards
    c.save(); c.globalAlpha = 0.22; c.strokeStyle = '#000'; c.lineWidth = 1;
    for (let d = WALL; d > -260; d -= 34) { const y = P([0, d, 0])[1]; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    c.restore();
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(0, floorY - 2, W, 4);
    // window
    const wq = [[win.x0, WALL, win.z0], [win.x1, WALL, win.z0], [win.x1, WALL, win.z1], [win.x0, WALL, win.z1]];
    poly(c, wq.map(p => add(p, [-7, 0, -7])).map((p, i) => [p[0] + (i === 1 || i === 2 ? 14 : 0), p[1], p[2] + (i >= 2 ? 14 : 0)]));
    c.fillStyle = rgb(mixc([8, 9, 11], [60, 60, 62], day)); c.fill();
    poly(c, wq);
    const a = P(wq[3]), b = P(wq[1]);
    g = c.createLinearGradient(a[0], a[1], b[0], b[1]);
    g.addColorStop(0, rgb(mixc([58, 70, 88], [236, 238, 236], day))); g.addColorStop(1, rgb(mixc([26, 32, 42], [206, 210, 210], day)));
    c.fillStyle = g; c.fill();
    if (day < 1) {  // moon
      const m = P([win.x1 - 46, WALL + 400, win.z1 + 40]);
      c.save(); poly(c, wq); c.clip();
      const mg = c.createRadialGradient(m[0], m[1], 2, m[0], m[1], 70);
      mg.addColorStop(0, `rgba(230,238,250,${0.95 * (1 - day)})`); mg.addColorStop(0.18, `rgba(200,214,232,${0.5 * (1 - day)})`); mg.addColorStop(1, 'rgba(200,214,232,0)');
      c.fillStyle = mg; c.fillRect(0, 0, W, H); c.restore();
    }
    c.strokeStyle = rgb(mixc([10, 11, 13], [70, 70, 72], day)); c.lineWidth = 7 * cam.zoom;
    const mid = P([(win.x0 + win.x1) / 2, WALL, win.z0]), mid2 = P([(win.x0 + win.x1) / 2, WALL, win.z1]);
    const hz = P([win.x0, WALL, (win.z0 + win.z1) / 2]), hz2 = P([win.x1, WALL, (win.z0 + win.z1) / 2]);
    c.beginPath(); c.moveTo(mid[0], mid[1]); c.lineTo(mid2[0], mid2[1]); c.moveTo(hz[0], hz[1]); c.lineTo(hz2[0], hz2[1]); c.stroke();
    // clock: the second hand ticks in time with the sound
    const cp = P(clock), cr = 25 * cp[2];
    c.beginPath(); c.arc(cp[0], cp[1], cr + 3, 0, TAU); c.fillStyle = '#050506'; c.fill();
    c.beginPath(); c.arc(cp[0], cp[1], cr, 0, TAU); c.fillStyle = rgb(mixc([44, 48, 54], [196, 196, 194], day)); c.fill();
    c.strokeStyle = '#050506'; c.lineCap = 'round';
    for (let i = 0; i < 12; i++) { const an = i / 12 * TAU; c.lineWidth = 2; c.beginPath(); c.moveTo(cp[0] + Math.cos(an) * cr * 0.78, cp[1] + Math.sin(an) * cr * 0.78); c.lineTo(cp[0] + Math.cos(an) * cr * 0.9, cp[1] + Math.sin(an) * cr * 0.9); c.stroke(); }
    const sec = tickAngle(t);
    const hand = (an, l, w) => { c.lineWidth = w; c.beginPath(); c.moveTo(cp[0], cp[1]); c.lineTo(cp[0] + Math.sin(an) * l, cp[1] - Math.cos(an) * l); c.stroke(); };
    hand(TAU * (3.1 / 12) + sec / 3600, cr * 0.5, 3.2); hand(TAU * 0.62 + sec / 60, cr * 0.72, 2.4);
    c.strokeStyle = '#7a2a22'; hand(sec, cr * 0.82, 1.2);
    // door and doorway
    const ang = doorAng(t);
    const dq = [[door.x0, WALL, 0], [door.x1, WALL, 0], [door.x1, WALL, door.z1], [door.x0, WALL, door.z1]];
    poly(c, dq.map((p, i) => [p[0] + (i === 0 || i === 3 ? -9 : 9), p[1], p[2] + (i >= 2 ? 9 : 0)])); c.fillStyle = rgb(mixc([9, 10, 12], [70, 70, 72], day)); c.fill();
    poly(c, dq);
    if (ang > 0.5) {
      const lit = sstep(0, 25, ang);
      c.fillStyle = rgb(mixc(mixc([16, 18, 22], [118, 118, 118], day), [255, 253, 246], lit)); c.fill();
    } else { c.fillStyle = rgb(mixc([30, 33, 38], [130, 130, 130], day)); c.fill(); }
    return floorY;
  }
  function drawDoorPanel(c, t, day) {
    const ang = doorAng(t) * D2R;
    const w = door.x1 - door.x0;
    const hinge = door.x1;
    const ex = hinge - Math.cos(ang) * w, ed = WALL - Math.sin(ang) * w;
    const q = [[hinge, WALL - 0.5, 0], [ex, ed, 0], [ex, ed, door.z1], [hinge, WALL - 0.5, door.z1]];
    poly(c, q); c.fillStyle = rgb(mixc([26, 29, 34], [104, 104, 106], day)); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 2; c.stroke();
    const kn = P(lerp3(q[1], q[2], 0.45).map((v, i) => i === 0 ? v + Math.cos(ang) * 10 : i === 1 ? v + Math.sin(ang) * 10 : v));
    c.beginPath(); c.arc(kn[0], kn[1], 4 * kn[2], 0, TAU); c.fillStyle = rgb(mixc([80, 84, 92], [190, 190, 190], day)); c.fill();
  }
  const tickAngle = t => { // one tick per second, each a quick eased snap with a tiny overshoot
    const s = t - T.cut1 + 0.6, i = Math.floor(s), f = s - i;
    return (i + E.over(clamp(f / 0.09), 6)) * TAU / 60;
  };
  // the clock ticks the sound timeline uses
  const ticks = [];
  for (let i = 1; ; i++) { const tt = T.cut1 - 0.6 + i; if (tt > T.cut1 + 30) break; ticks.push(tt); }

  function furniture(c, t, day, J, mask) {
    const col = k => ({
      front: rgb(mixc([18, 20, 24], [96, 96, 98], day).map(v => v * k)),
      top: rgb(mixc([34, 38, 44], [150, 150, 150], day).map(v => v * k)),
      side: rgb(mixc([13, 15, 18], [80, 80, 82], day).map(v => v * k)),
    });
    const items = [];
    items.push({ d: 150, draw: () => {
      // headboard
      box(c, { x0: bed.x0 - 14, x1: bed.x0, d0: 120, d1: WALL, z0: 0, z1: 170 }, col(0.9));
      box(c, bed, col(1.0));
      box(c, mattress, col(1.6));
      // pillow + blanket fold
      box(c, { x0: bed.x0 + 8, x1: bed.x0 + 78, d0: 120, d1: 210, z0: 98, z1: 116 }, col(2.0));
      box(c, { x0: bed.x0 + 120, x1: mattress.x1 + 2, d0: mattress.d0 - 2, d1: WALL - 2, z0: 60, z1: 101 }, col(1.3));
    } });
    items.push({ d: table.d0 + 26, draw: () => {
      box(c, { ...table, z0: table.z1 - 8 }, col(1.8));
      for (const lx of [table.x0 + 4, table.x1 - 8]) for (const ld of [table.d0 + 4, table.d1 - 8]) box(c, { x0: lx, x1: lx + 4, d0: ld, d1: ld + 4, z0: 0, z1: table.z1 - 8 }, col(1.5));
      // phone, screen lights up while the alarm rings
      const ph = [table.x1 - 20, 10, table.z1];
      box(c, { x0: ph[0] - 8, x1: ph[0] + 8, d0: -2, d1: 22, z0: table.z1, z1: table.z1 + 3 }, { front: '#050505', top: '#0a0a0a', side: '#050505' });
      const ring = t > T.alarm0 && t < T.alarm1 ? 0.65 + 0.35 * Math.sin((t - T.alarm0) * TAU * 2) : 0;
      if (ring > 0 && !MIRROR) {
        const jit = Math.sin(t * 90) * 0.8;
        poly(c, [[ph[0] - 6 + jit, 0, table.z1 + 3.2], [ph[0] + 6 + jit, 0, table.z1 + 3.2], [ph[0] + 6 + jit, 20, table.z1 + 3.2], [ph[0] - 6 + jit, 20, table.z1 + 3.2]]);
        c.fillStyle = `rgba(240,244,250,${ring})`; c.fill();
        const pp = P(ph);
        c.save(); c.globalCompositeOperation = 'lighter';
        const g = c.createRadialGradient(pp[0], pp[1], 0, pp[0], pp[1], 60);
        g.addColorStop(0, `rgba(220,230,255,${0.3 * ring})`); g.addColorStop(1, 'rgba(220,230,255,0)');
        c.fillStyle = g; c.fillRect(pp[0] - 60, pp[1] - 60, 120, 120); c.restore();
      }
    } });
    if (mask.depth > table.d0 && t >= T.maskDown && t < T.pick) items.push({ d: table.d0 + 1, draw: () => drawMask(c, mask) });
    items.push({ d: J.P[1] - 0.5, draw: () => drawFigure(c, M, J, (t < T.maskDown || t >= T.pick) ? { mask, handOver: (t > T.maskGrab - 0.1 && t < T.maskDown) || (t > T.pick - 0.1 && t < T.wear + 0.15) ? ['L'] : [] } : {}) });
    items.sort((a, b) => b.d - a.d);
    for (const it of items) it.draw();
    if (t >= T.maskDown && t < T.pick && mask.depth <= table.d0) drawMask(c, mask);
  }

  function draw(t) {
    const day = dayAt(t);
    // camera: settles in, pushes slowly toward the bed, then follows to the door
    const push = E.io(inv(T.slump0 - 0.6, T.morn + 0.3, t));
    const follow = E.io(inv(T.mWalk - 0.3, T.end, t));
    cam.x = lerp(lerp(440, 420, push), 470, follow);
    const walking = sstep(T.hWalk - 0.2, T.hWalk + 0.7, t) * (1 - sstep(T.sit0 - 0.1, T.sit0 + 0.8, t));
    cam.x = lerp(cam.x, lerp(440, M.rootAt(t)[0] - 10, 0.7), walking);
    // the morning exit is a side-on tracking shot too
    const leaving = sstep(T.mWalk - 0.1, T.mWalk + 0.6, t) * (1 - sstep(T.end - 0.7, T.end, t));
    cam.x = lerp(cam.x, M.rootAt(t)[0] + 45, leaving * 0.8);
    cam.zoom = lerp(lerp(1.42, 1.56, push), 1.46, follow);
    cam.hy = lerp(640, 610, push); cam.h = 262;
    const J = M.pose(t);
    const mask = maskState(t, J);
    const floorY = drawRoomBack(ctx, t, day);

    // moonlight / daylight through the window onto the floor
    const Ld = norm([0.42, -1.0, -0.72]);
    const corners = [[win.x0, WALL, win.z0], [win.x1, WALL, win.z0], [win.x1, WALL, win.z1], [win.x0, WALL, win.z1]];
    const hit = corners.map(p => { const lam = p[2] / -Ld[2]; return add(p, mul(Ld, lam)); });
    softLayer(14, 'screen', c => { poly(c, hit); c.fillStyle = rgb(mixc([60, 74, 96], [150, 150, 148], day), 0.75); c.fill(); });

    reflection(c => { drawDoorPanel(c, t, day); furniture(c, t, day, J, mask); }, floorY, lerp(0.22, 0.16, day));
    drawDoorPanel(ctx, t, day);
    contactShadow(ctx, J, lerp(0.7, 0.45, day));
    furniture(ctx, t, day, J, mask);

    // light shaft through the air
    softLayer(22, 'screen', c => {
      const ga = P(corners[3]), gb = P(hit[1]);
      const g = c.createLinearGradient(ga[0], ga[1], gb[0], gb[1]);
      g.addColorStop(0, rgb(mixc([90, 110, 140], [200, 200, 196], day), 0.2)); g.addColorStop(1, rgb(mixc([90, 110, 140], [200, 200, 196], day), 0.0));
      poly(c, [corners[0], corners[3], corners[2], hit[2], hit[1], hit[0]]); c.fillStyle = g; c.fill();
    });

    // light grade: cold blue-grey night, pale white morning
    ctx.save(); ctx.globalCompositeOperation = 'multiply';
    const wc = P([(win.x0 + win.x1) / 2, 40, 120]);
    const gg = ctx.createRadialGradient(wc[0], wc[1], 30, wc[0], wc[1], 760);
    gg.addColorStop(0, rgb(mixc([196, 206, 222], [255, 255, 255], day))); gg.addColorStop(0.6, rgb(mixc([104, 112, 128], [224, 224, 222], day))); gg.addColorStop(1, rgb(mixc([30, 33, 40], [130, 130, 130], day)));
    ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H); ctx.restore();

    // daylight spilling through the open door
    const ang = doorAng(t);
    if (ang > 0.5) {
      const lit = sstep(0, 40, ang);
      softLayer(26, 'screen', c => {
        poly(c, [[door.x0, WALL, 0], [door.x1, WALL, 0], [door.x1 + 120, WALL - 260, 0], [door.x0 - 40, WALL - 260, 0]]);
        c.fillStyle = `rgba(255,252,240,${0.35 * lit})`; c.fill();
      });
      ctx.save(); ctx.globalCompositeOperation = 'screen';
      const dc = P([(door.x0 + door.x1) / 2, WALL, 120]);
      const dg = ctx.createRadialGradient(dc[0], dc[1], 10, dc[0], dc[1], 260);
      dg.addColorStop(0, `rgba(255,252,240,${0.45 * lit})`); dg.addColorStop(1, 'rgba(255,252,240,0)');
      ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    vignette(lerp(0.85, 0.6, day));
    captionAt(t, 'ASK TWICE.', T.ask2a, T.ask2b + 10);
  }
  return { draw, fig: M, ticks, maskPos: (t, J) => maskState(t, J).pos };
})();

// Foot-lock check: for every figure and frame, how far the drawn ankle is from
// where the foot planner put it (non-zero = the leg could not reach, i.e. a slide),
// how far a planted foot's pivot moved, and whether a foot dipped through the floor.
function footCheck(step = 1 / 120) {
  const figs = [...PARTY.figs.map(f => [f, 0, T.cut1]), [HOME.fig, T.cut1, T.end], [WALKTEST.fig, 0, WALKTEST.dur]];
  const res = [];
  for (const [f, a, b] of figs) {
    let reach = 0, reachT = 0, drift = 0, driftT = 0, below = 0;
    const last = { L: null, R: null };
    for (let t = a; t <= b; t += step) {
      const J = f.pose(t);
      for (const side of ['L', 'R']) {
        const ft = J.feet[side];
        if (ft.planted) {
          const e = len(sub(J.ank[side], ft.ank));
          if (e > reach) { reach = e; reachT = t; }
          // contact point actually drawn on screen (heel when rolling on the heel, toe when on the toe)
          const piv = ft.pitch >= 0 ? J.heel[side] : J.toe[side];
          const key = ft.pitch >= 0 ? 'h' : 't';
          const l = last[side];
          if (l && l.key === key && l.pl === ft.plant) { const d = Math.hypot(piv[0] - l.p[0], piv[1] - l.p[1], piv[2] - l.p[2]); if (d > drift) { drift = d; driftT = t; } }
          last[side] = { p: piv, key, pl: ft.plant };
        } else {
          last[side] = null;
          below = Math.min(below, J.toe[side][2], J.heel[side][2]);
        }
      }
    }
    res.push({ fig: f.id, maxReachError: +reach.toFixed(3), at: +reachT.toFixed(3), maxPlantedDriftPerTick: +drift.toFixed(3), driftAt: +driftT.toFixed(3), lowestSwingFoot: +below.toFixed(2) });
  }
  return res;
}

// ---------------------------------------------------------------- render
function render(t) {
  t = Math.max(0, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (TEST) { WALKTEST.draw(Math.min(t, WALKTEST.dur)); return; }
  if (t < T.cut1) PARTY.draw(t); else HOME.draw(t);
  grain(t, 0.07);
  // fade in from black at the very start, fade to black at the end
  const fade = Math.max(1 - sstep(0, 0.35, t), sstep(T.fade0, T.end - 0.05, t));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  // the last caption stays readable over the fade until the very end
  if (t > T.fade0) {
    const a = (1 - sstep(T.end - 0.32, T.end - 0.02, t)) * sstep(T.fade0, T.fade0 + 0.2, t);
    ctx.save(); ctx.globalAlpha = 1; caption('ASK TWICE.', a * sstep(T.fade0, T.end - 0.05, t), 0); ctx.restore();
  }
}

// sound cues the animation itself produces (footsteps at heel contact etc.)
function getCues() {
  const steps = [];
  for (const f of PARTY.figs) for (const c of f.cues) steps.push(c);
  for (const c of HOME.fig.cues) steps.push(c);
  steps.forEach(c => { c.frame = Math.round(c.t * FPS); });
  return { story: { ...T }, steps: steps.sort((a, b) => a.t - b.t), ticks: HOME.ticks.filter(x => x > T.cut1 && x < T.end), fps: FPS, duration: T.end };
}

window.FPS = FPS;
window.DURATION = TEST ? WALKTEST.dur : T.end;
window.footCheck = footCheck;
// Pop check: per frame, the largest change in velocity of any joint (px/frame²).
window.popCheck = function () {
  const res = [];
  const track = (name, fig, a, b, extra) => {
    let prev = null, prev2 = null; const spikes = [];
    for (let f = Math.ceil(a * FPS); f <= Math.floor(b * FPS); f++) {
      const t = f / FPS, J = fig.pose(t);
      const pts = [J.P, J.N, J.Hc, J.hand.L, J.hand.R, J.el.L, J.el.R, J.knee.L, J.knee.R, J.ank.L, J.ank.R];
      if (extra) pts.push(extra(t, J));
      if (prev && prev2) {
        let worst = 0, wi = -1;
        pts.forEach((p, i) => { const acc = len(sub(add(p, prev2[i]), mul(prev[i], 2))); if (acc > worst) { worst = acc; wi = i; } });
        spikes.push({ t: +t.toFixed(3), acc: +worst.toFixed(2), joint: ['pelvis', 'neck', 'head', 'handL', 'handR', 'elbowL', 'elbowR', 'kneeL', 'kneeR', 'ankleL', 'ankleR', 'mask'][wi] });
      }
      prev2 = prev; prev = pts;
    }
    spikes.sort((x, y) => y.acc - x.acc);
    res.push({ fig: name, top: spikes.slice(0, 6) });
  };
  for (const f of PARTY.figs) track(f.id, f, 0, T.cut1 - 0.01);
  track('M2', HOME.fig, T.cut1, T.end - 0.01, HOME.maskPos);
  return res;
};
window.render = render;
window.getCues = getCues;
window.STORY = T;
window.__debug = { PARTY, HOME, WALKTEST, cam, P };

// live preview loop (skipped when the renderer drives the page)
const qs = new URLSearchParams(location.search);
if (qs.has('render')) document.body.classList.add('render');
else {
  const t0 = performance.now();
  const startAt = parseFloat(qs.get('t') || '0');
  const loop = () => { render((startAt + (performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(loop);
}
</script>
</body>
